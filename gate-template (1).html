<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<style>
  :root {
    --indigo: #2F15C9;
    --indigo-deep: #180A64;
    --indigo-tint: #E2ECFF;
    --greige: #F5F4F2;
    --slate: #544F4C;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--greige);
    color: var(--indigo-deep);
    font-family: var(--sans);
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: #FFFFFF;
    padding: 44px 40px 36px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--slate);
    margin: 0 0 22px;
  }

  h1 {
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    font-weight: 500;
    margin: 0 0 10px;
  }

  .lede {
    font-size: 15px;
    line-height: 1.45;
    color: var(--slate);
    margin: 0 0 30px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 8px;
  }

  .row { display: flex; gap: 10px; align-items: stretch; }

  input {
    flex: 1;
    min-width: 0;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--indigo-deep);
    background: var(--indigo-tint);
    border: 1px solid transparent;
    border-radius: 2px;
    padding: 12px 14px;
  }

  input:focus-visible {
    outline: none;
    border-color: var(--indigo);
    box-shadow: 0 0 0 3px rgba(47, 21, 201, 0.18);
  }

  button {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    color: #FFFFFF;
    background: var(--indigo);
    border: 0;
    border-radius: 2px;
    padding: 12px 20px;
    cursor: pointer;
  }

  button:hover:not(:disabled) { background: var(--indigo-deep); }
  button:focus-visible { outline: 2px solid var(--indigo-deep); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: default; }

  /* Signature element: the rule reports real work. Key derivation is
     deliberately slow (600k PBKDF2 rounds), so this sweeps for as long as
     the browser is actually deriving, then stops. */
  .track {
    position: relative;
    height: 2px;
    margin-top: 18px;
    background: var(--indigo-tint);
    overflow: hidden;
  }

  .track::after {
    content: "";
    position: absolute;
    inset: 0 100% 0 0;
    background: var(--indigo);
  }

  .track.working::after { animation: sweep 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

  @keyframes sweep {
    0%   { inset: 0 100% 0 0; }
    55%  { inset: 0 0 0 0; }
    100% { inset: 0 0 0 100%; }
  }

  .status {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    margin: 12px 0 0;
    min-height: 1.5em;
    color: var(--slate);
  }

  .status[data-tone="error"] { color: #B6622A; }

  @media (prefers-reduced-motion: reduce) {
    .track.working::after { animation: none; inset: 0 35% 0 0; }
  }

  @media (max-width: 420px) {
    .card { padding: 32px 24px 28px; }
    .row { flex-direction: column; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Zip &middot; Solution Operations</p>
    <h1>__TITLE__</h1>
    <p class="lede">This report is encrypted. Enter the password to decrypt it in your browser.</p>

    <form id="gate" novalidate>
      <label for="pw">Password</label>
      <div class="row">
        <input id="pw" name="password" type="password" autocomplete="current-password"
               autofocus spellcheck="false" aria-describedby="status">
        <button type="submit" id="go">Open report</button>
      </div>
      <div class="track" id="track" aria-hidden="true"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
(function () {
  'use strict';

  var P = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('gate');
  var input = document.getElementById('pw');
  var button = document.getElementById('go');
  var track = document.getElementById('track');
  var status = document.getElementById('status');

  var SESSION_KEY = 'gate.key.v1';

  function say(msg, tone) {
    status.textContent = msg;
    if (tone) { status.setAttribute('data-tone', tone); }
    else { status.removeAttribute('data-tone'); }
  }

  function working(on) {
    track.classList.toggle('working', on);
    button.disabled = on;
    input.disabled = on;
  }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { out[i] = bin.charCodeAt(i); }
    return out;
  }

  function bytesToB64(bytes) {
    var s = '';
    var a = new Uint8Array(bytes);
    for (var i = 0; i < a.length; i++) { s += String.fromCharCode(a[i]); }
    return btoa(s);
  }

  // crypto.subtle only exists in a secure context (https, or localhost).
  if (!window.crypto || !window.crypto.subtle) {
    working(false);
    form.hidden = true;
    say('This page needs a secure connection to decrypt. Open it over https, ' +
        'or serve the folder locally with: python3 -m http.server', 'error');
    return;
  }

  function deriveKey(password) {
    return crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    ).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToBytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        true,
        ['decrypt']
      );
    });
  }

  function importRawKey(raw) {
    return crypto.subtle.importKey(
      'raw', b64ToBytes(raw), { name: 'AES-GCM', length: 256 }, true, ['decrypt']
    );
  }

  function decrypt(key) {
    return crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(P.iv) }, key, b64ToBytes(P.ct)
    ).then(function (buf) {
      return new TextDecoder().decode(buf);
    });
  }

  // Replace the whole document. document.write after load runs the inline
  // scripts in the decrypted report, which innerHTML would not.
  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function remember(key) {
    return crypto.subtle.exportKey('raw', key).then(function (raw) {
      try { sessionStorage.setItem(SESSION_KEY, bytesToB64(raw)); } catch (e) { /* private mode */ }
    }).catch(function () { /* not exportable, no problem */ });
  }

  function unlock(password) {
    working(true);
    say('Deriving key\u2026');

    // Yield a frame so the sweep is painted before PBKDF2 blocks.
    requestAnimationFrame(function () {
      deriveKey(password)
        .then(function (key) {
          say('Decrypting\u2026');
          return decrypt(key).then(function (html) {
            return remember(key).then(function () { render(html); });
          });
        })
        .catch(function () {
          working(false);
          say('That password didn\u2019t work. Check for stray spaces and try again.', 'error');
          input.value = '';
          input.focus();
        });
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = input.value;
    if (!pw) { say('Enter the password to continue.', 'error'); input.focus(); return; }
    unlock(pw);
  });

  input.addEventListener('input', function () {
    if (status.getAttribute('data-tone') === 'error') { say(''); }
  });

  // Same tab, already unlocked once: skip the prompt.
  var saved = null;
  try { saved = sessionStorage.getItem(SESSION_KEY); } catch (e) { /* ignore */ }

  if (saved) {
    working(true);
    say('Restoring session\u2026');
    importRawKey(saved)
      .then(decrypt)
      .then(render)
      .catch(function () {
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* ignore */ }
        working(false);
        say('');
        input.focus();
      });
  }
})();
</script>
</body>
</html>
